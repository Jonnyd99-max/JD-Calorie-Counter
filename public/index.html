<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c32">
  <meta name="description" content="Your meals, made clearer. A private food diary with source-backed nutrition and honest photo estimates.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <title>JD Food Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="app-header"><a class="brand" href="#today"><span class="brand-mark">jd<span>✦</span></span><span>FOOD TRACKER</span></a><span class="local-badge"><i></i> Saved on this device</span></header>
    <main id="main" tabindex="-1"><p class="loading">Opening your food diary…</p></main>
    <nav aria-label="Main navigation" class="bottom-nav">
      <a href="#today" data-nav="today"><span class="nav-icon">◷</span>Today</a>
      <a href="#add" data-nav="add"><span class="nav-icon">＋</span>Add meal</a>
      <a href="#history" data-nav="history"><span class="nav-icon">▤</span>History</a>
      <a href="#settings" data-nav="settings"><span class="nav-icon">⚙</span>Settings</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="update-banner" hidden><span>A new version is ready. Your saved meals will stay.</span><button id="update-now">Update app</button><button id="update-later" aria-label="Dismiss update">×</button></div>
  <dialog id="food-dialog"><div id="food-dialog-body"></div></dialog>
</body>
</html>
