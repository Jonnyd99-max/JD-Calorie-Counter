name: Validate and deploy JD Food Tracker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations, backups and backend security
        run: node --test tests/*.test.js
      - uses: actions/cache@v4
        with:
          path: .cache/usda-sr-legacy.zip
          key: usda-sr-legacy-april-2018-v1
      - name: Build source-backed offline nutrition database
        run: python scripts/download-usda.py
      - name: Build static app and icons
        run: node scripts/build.mjs
      - name: Validate deployed dataset
        run: node --test tests/dataset.test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
